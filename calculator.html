<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern JS Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f7f6;
        }

        .calculator {
            background-color: #1e222b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            width: 320px;
        }

        .display {
            width: 100%;
            height: 70px;
            background-color: #282c34;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #ffffff;
            font-size: 2rem;
            text-align: right;
            padding: 15px;
            pointer-events: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 18px;
            font-size: 1.25rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #3e4451;
            color: #ffffff;
            transition: background 0.1s ease;
        }

        button:active {
            opacity: 0.8;
        }

        button.operator {
            background-color: #ff9f0a;
            color: white;
            font-weight: bold;
        }

        button.clear {
            background-color: #e06c75;
            color: white;
        }

        button.equal {
            grid-column: span 2;
            background-color: #98c379;
            color: #1e222b;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" class="display" value="0" readonly>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendValue('/')" class="operator">÷</button>
            <button onclick="appendValue('*')" class="operator">×</button>
            <button onclick="appendValue('-')" class="operator">−</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('+')" class="operator">+</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="deleteLast()">⌫</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="calculate()" class="equal">=</button>
            
            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        let shouldResetDisplay = false;

        /* function appendValue(value) {
            if (display.value === '0' || shouldResetDisplay) {
                resetDisplayState();
            }
            
            // Prevent consecutive operators
            const lastChar = display.value.slice(-1);
            if (isOperator(value) && isOperator(lastChar)) {
                return;
            }

            display.value += value;
        */

        function appendValue(value) {
        // If a calculation just finished
        if (shouldResetDisplay) {
            if (isOperator(value)) {
                // FIX: If starting with an operator, keep the old answer on screen
                shouldResetDisplay = false; 
            } else {
                // If starting with a number, clear the old answer out entirely
                resetDisplayState();
            }
        } else if (display.value === '0' && !isOperator(value)) {
            // Clear initial zero when a new number sequence begins
            display.value = '';
        }
        
        // Prevent consecutive double operators (e.g., ++ or *+)
        const lastChar = display.value.slice(-1);
        if (isOperator(value) && isOperator(lastChar)) {
            return;
        }

        display.value += value;
}

        function isOperator(char) {
            return ['+', '-', '*', '/'].includes(char);
        }

        function resetDisplayState() {
            display.value = '';
            shouldResetDisplay = false;
        }

        function clearDisplay() {
            display.value = '0';
        }

        function deleteLast() {
            if (display.value.length > 1) {
                display.value = display.value.slice(0, -1);
            } else {
                display.value = '0';
            }
        }

        function calculate() {
            try {
                const expression = display.value;
                
                // Secure calculation token parsing to avoid using eval()
                const result = Function(`"use strict"; return (${expression})`)();
                
                if (result === Infinity || isNaN(result)) {
                    display.value = "Error";
                } else {
                    // Format decimal outputs cleanly
                    display.value = Number(result.toFixed(8)).toString();
                }
            } catch (error) {
                display.value = 'Error';
            }
            shouldResetDisplay = true;
        }
    </script>
</body>
</html>
